[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroforge"
version = "3.0.0"
description = "NeuroForge CANRP-X — Closed-Loop Autonomous Neuro-Restoration Platform"
readme = "README.md"
license = { text = "Proprietary — Research Use Only" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.12,<2.0",
    "torch>=2.2,<3.0",
    "mlflow>=2.12,<3.0",
    "optuna>=3.6,<4.0",
    "tqdm>=4.66,<5.0",
]

[project.scripts]
neuroforge = "neuroforge.pipeline:run_pipeline"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuroforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["neuroforge"]
omit = ["*/tests/*", "*/dashboard/*"]
